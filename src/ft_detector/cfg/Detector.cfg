#!/usr/bin/env python3
"""Runtime detector fields. Defaults must match ft_bringup/config/detector.yaml:tuning."""

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, int_t, double_t

gen = ParameterGenerator()
for prefix, defaults in [
    ('blue', (85, 135, 65, 255, 130, 255)),
    ('red_low', (0, 35, 80, 255, 210, 255)),
    ('red_high', (160, 179, 80, 255, 210, 255)),
]:
    for name, default in zip(('h_min', 'h_max', 's_min', 's_max', 'v_min', 'v_max'), defaults):
        gen.add(prefix + '_' + name, int_t, 1, prefix + ' HSV ' + name,
                default, 0, 179 if name.startswith('h_') else 255)

gen.add('min_contour_area', double_t, 1, 'Minimum light contour area (pixels squared)', 20.0, 0.1, 10000.0)
gen.add('max_pair_spacing_ratio', double_t, 1, 'Maximum centre spacing / mean light length', 5.8, 0.1, 20.0)
gen.add('max_pair_angle_deg', double_t, 1, 'Maximum undirected light angle difference (degrees)', 12.0, 0.1, 90.0)

exit(gen.generate('ft_detector', 'ft_detector', 'Detector'))
