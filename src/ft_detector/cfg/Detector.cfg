#!/usr/bin/env python3
"""Runtime fields; defaults match detector.yaml and model.yaml under tuning."""

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, int_t, double_t

gen = ParameterGenerator()
for prefix, defaults in [
    ('blue', (85, 135, 65, 255, 130, 255)),
    ('red_low', (0, 35, 80, 255, 210, 255)),
    ('red_high', (160, 179, 80, 255, 210, 255)),
]:
    for name, default in zip(('h_min', 'h_max', 's_min', 's_max', 'v_min', 'v_max'), defaults):
        gen.add(prefix + '_' + name, int_t, 1, prefix + ' HSV ' + name,
                default, 0, 179 if name.startswith('h_') else 255)

gen.add('min_contour_area', double_t, 1, 'Minimum light contour area (pixels squared)', 20.0, 0.1, 10000.0)
gen.add('max_pair_spacing_ratio', double_t, 1, 'Maximum centre spacing / mean light length', 5.8, 0.1, 20.0)
gen.add('max_pair_angle_deg', double_t, 1, 'Maximum undirected light angle difference (degrees)', 12.0, 0.1, 90.0)
gen.add('min_light_length', double_t, 1, 'Minimum light length (pixels)', 10.0, 0.1, 2000.0)
gen.add('min_light_aspect', double_t, 1, 'Minimum light length / width', 2.5, 1.01, 100.0)
gen.add('max_light_aspect', double_t, 1, 'Maximum light length / width', 15.0, 1.01, 100.0)
gen.add('min_light_fill', double_t, 1, 'Minimum contour area / rectangle area', 0.45, 0.001, 1.0)
gen.add('max_light_tilt_deg', double_t, 1, 'Maximum light tilt from vertical (degrees)', 30.0, 0.1, 89.9)
gen.add('border_margin', int_t, 1, 'Rejected border width (pixels)', 1, 0, 1000)
gen.add('min_pair_length_ratio', double_t, 1, 'Minimum short / long light length', 0.75, 0.001, 1.0)
gen.add('max_pair_center_dy_ratio', double_t, 1, 'Maximum vertical offset / mean light length', 0.35, 0.001, 10.0)
gen.add('min_pair_spacing_ratio', double_t, 1, 'Minimum centre spacing / mean light length', 1.4, 0.001, 20.0)
gen.add('large_armor_min_spacing_ratio', double_t, 1, 'Large armor spacing threshold (Traditional and NN)', 3.4, 0.001, 20.0)
gen.add('intervening_light_max_offset_ratio', double_t, 1, 'Intervening light offset / mean light length', 0.5, 0.001, 10.0)
gen.add('pair_ambiguity_margin', double_t, 1, 'Maximum cost gap considered ambiguous', 0.1, 0.0, 10.0)
gen.add('nn_min_color_score', double_t, 1, 'NN minimum winning blue/red score', 0.5, 0.0, 1.0)
gen.add('nn_min_number_score', double_t, 1, 'NN minimum winning number score', 0.5, 0.0, 1.0)
gen.add('nn_min_confidence', double_t, 1, 'NN minimum color score times number score', 0.25, 0.0, 1.0)
gen.add('nn_nms_iou', double_t, 1, 'NN class-agnostic bounding-box NMS IoU', 0.5, 0.0, 1.0)

exit(gen.generate('ft_detector', 'ft_detector', 'Detector'))
