detection_topic: /ft/detection
target_topic: /ft/target
marker_topic: /ft/debug/selector
prediction_topic: /ft/debug/rotation_prediction
queue_size: 5

# Initial radius; the filter estimates radius and, for four plates, pair offsets.
radius_m: 0.25
plate_count: 4
geometry:
  estimate_pair_offsets: true
  radius_min_m: 0.05
  radius_max_m: 0.50
  max_height_difference_m: 0.20
  initial_variance: 0.0025      # m^2 for r, delta_r and delta_h
  noise_density: 0.00001       # random walk, m^2/s
  min_phase_span_rad: 0.35
  min_observations: 10
association_position_m: 0.40
association_yaw_rad: 0.70
lost_timeout_s: 0.5

linear_noise_density: 2.0      # m^2/s^3
angular_noise_density: 10.0    # rad^2/s^3
position_variance: 0.0025      # m^2
yaw_variance: 0.04             # rad^2
initial_velocity_variance: 4.0 # (m/s)^2
initial_omega_variance: 25.0   # (rad/s)^2

min_horizontal_normal: 0.5    # Reject normals with too little horizontal projection.
min_facing_cosine: 0.20       # Minimum facing score for future plate selection.
marker_size_m: 0.08
marker_lifetime_s: 0.6
