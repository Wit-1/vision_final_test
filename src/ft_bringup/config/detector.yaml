# image_transport uses the base topic and appends /compressed for this transport.
image_topic: /hk_camera/image_raw
image_transport: compressed
camera_info_topic: /hk_camera/camera_info
debug_image_topic: /ft/debug/image
detection_topic: /ft/detection

# Keep queues small so old frames do not accumulate.
image_queue_size: 1
camera_info_queue_size: 1
debug_queue_size: 1
detection_queue_size: 1

# 2.1: HSV masks can be selected independently in rqt_image_view.
blue_mask_topic: /ft/debug/mask/blue
red_mask_topic: /ft/debug/mask/red
debug_details: false

# Online fields use the same names as Detector.cfg under /ft_detector/tuning.
tuning:
  # OpenCV uint8 HSV: H 0..179, S/V 0..255. Red wraps around H=0.
  blue_h_min: 85
  blue_h_max: 135
  blue_s_min: 65
  blue_s_max: 255
  blue_v_min: 130
  blue_v_max: 255
  red_low_h_min: 0
  red_low_h_max: 35
  red_low_s_min: 80
  red_low_s_max: 255
  red_low_v_min: 210
  red_low_v_max: 255
  red_high_h_min: 160
  red_high_h_max: 179
  red_high_s_min: 80
  red_high_s_max: 255
  red_high_v_min: 210
  red_high_v_max: 255
  min_contour_area: 20.0          # px^2
  max_pair_spacing_ratio: 5.8    # centre distance / mean light length
  max_pair_angle_deg: 12.0

traditional:
  # Pure traditional search history; no NN or downstream tracker is required.
  # Restart the launch/session after changing these fields.
  roi:
    enabled: true
    search_interval_s: 0.2
    max_history_gap_s: 0.5
    horizontal_padding: 2.0
    vertical_padding: 0.5
    min_width: 64
    min_height: 32
    confirmation_searches: 2
    max_misses: 2

  # 2.2: single-light geometry. Area is px^2; length and border are pixels.
  min_light_length: 10.0
  min_light_aspect: 2.5
  max_light_aspect: 15.0
  min_light_fill: 0.45
  max_light_tilt_deg: 30.0
  border_margin: 1

  # 2.3/2.4: dimensionless geometry, normalized by mean light length.
  min_pair_length_ratio: 0.75
  max_pair_center_dy_ratio: 0.35
  min_pair_spacing_ratio: 1.4
  large_armor_min_spacing_ratio: 3.4
  intervening_light_max_offset_ratio: 0.5
  pair_ambiguity_margin: 0.1

# Endpoint dimensions are loaded from armor_dimensions.yaml by detector.launch.
pnp:
  enabled: true
  min_depth_m: 0.05
  max_depth_m: 30.0
  max_reprojection_error_px: 3.0
  continuity:
    enabled: true
    error_margin_px: 1.0         # 距当前最优 RMS 不超过 1 px 的合格解之间消歧。
    max_gap_s: 0.1              # 图像时间；重复、倒退或间隔过大时重新初始化。
    max_corner_shift_ratio: 0.5 # 四点位移 RMS / 两帧中较短的平均灯长。
  min_quad_area_px2: 20.0
  min_edge_length_px: 2.0
  axis_length_m: 0.03
  publish_tf: true
  child_frame_prefix: armor_
