# image_transport uses the base topic and appends /compressed for this transport.
image_topic: /hk_camera/image_raw
image_transport: compressed
camera_info_topic: /hk_camera/camera_info
debug_image_topic: /ft/debug/image

# Keep queues small so old frames do not accumulate.
image_queue_size: 1
camera_info_queue_size: 1
debug_queue_size: 1

# 2.1: HSV masks can be selected independently in rqt_image_view.
blue_mask_topic: /ft/debug/mask/blue
red_mask_topic: /ft/debug/mask/red
debug_details: false

traditional:
  # OpenCV uint8 HSV: H 0..179, S/V 0..255. Red wraps around H=0.
  blue: {h_min: 85, h_max: 135, s_min: 65, s_max: 255, v_min: 130, v_max: 255}
  red_low: {h_min: 0, h_max: 35, s_min: 80, s_max: 255, v_min: 210, v_max: 255}
  red_high: {h_min: 160, h_max: 179, s_min: 80, s_max: 255, v_min: 210, v_max: 255}

  # 2.2: single-light geometry. Area is px^2; length and border are pixels.
  min_contour_area: 20.0
  min_light_length: 10.0
  min_light_aspect: 2.5
  max_light_aspect: 15.0
  min_light_fill: 0.45
  max_light_tilt_deg: 30.0
  border_margin: 1

  # 2.3/2.4: dimensionless geometry, normalized by mean light length.
  min_pair_length_ratio: 0.75
  max_pair_angle_deg: 12.0
  max_pair_center_dy_ratio: 0.35
  min_pair_spacing_ratio: 1.4
  max_pair_spacing_ratio: 5.8
  large_armor_min_spacing_ratio: 3.4
  intervening_light_max_offset_ratio: 0.5
  pair_ambiguity_margin: 0.1
