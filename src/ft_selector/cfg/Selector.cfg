#!/usr/bin/env python3
"""Online rotating filter fields and prediction horizon, without model geometry."""

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

gen = ParameterGenerator()
gen.add('linear_noise_density', double_t, 1, 'Centre acceleration noise density (m^2/s^3)', 2.0, 0.000001, 1000.0)
gen.add('angular_noise_density', double_t, 1, 'Angular acceleration noise density (rad^2/s^3)', 10.0, 0.000001, 1000.0)
gen.add('position_variance', double_t, 1, 'Plate position measurement variance (m^2)', 0.0025, 0.000001, 10.0)
gen.add('yaw_variance', double_t, 1, 'Plate yaw measurement variance (rad^2)', 0.04, 0.000001, 10.0)
gen.add('association_position_m', double_t, 1, 'Position association gate (metres)', 0.4, 0.001, 10.0)
gen.add('association_yaw_rad', double_t, 1, 'Yaw gate; must be less than pi / plate_count (radians)', 0.7, 0.001, 1.57)
gen.add('prediction_time_s', double_t, 1, 'Prediction horizon (seconds)', 0.1, 0.0, 5.0)

exit(gen.generate('ft_selector', 'ft_selector', 'Selector'))
