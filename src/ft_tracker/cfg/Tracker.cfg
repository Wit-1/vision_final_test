#!/usr/bin/env python3
"""Online linear filter fields; the node seeds defaults from startup YAML."""

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

gen = ParameterGenerator()
gen.add('process_noise_density', double_t, 1, 'White acceleration noise density (m^2/s^3)', 2.0, 0.000001, 1000.0)
gen.add('measurement_noise_variance', double_t, 1, 'Position measurement variance (m^2)', 0.0025, 0.000001, 10.0)
gen.add('association_distance_m', double_t, 1, 'Position association gate (metres)', 0.5, 0.001, 10.0)
gen.add('prediction_time_s', double_t, 1, 'Prediction horizon (seconds)', 0.1, 0.0, 5.0)

exit(gen.generate('ft_tracker', 'ft_tracker', 'Tracker'))
